name: CI

on:
  pull_request:
    branches: [staging, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests, builds and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
  browser:
    name: Browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:boundaries:browser
      - run: pnpm test:performance:browser
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: apps/web/.next/route-loading
          if-no-files-found: ignore
          retention-days: 7
  gate:
    name: CI
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
