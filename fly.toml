# fly.toml app configuration file generated for 2048-socket on 2025-10-04T20:33:42-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '2048-socket'
primary_region = 'dfw'
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]
  dockerfile = './Dockerfile'

[env]
  PORT = '4000'
  RESULT_OUTBOX_DIR = '/data/results'

[[mounts]]
  source = 'results'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 4000
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[services.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
