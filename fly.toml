# In-memory rooms require one Machine. Use node scripts/deploy-socket.mjs production.

app = '2048-socket'
primary_region = 'nrt'
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]
  dockerfile = './Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  APP_ENV = 'production'
  PORT = '4000'
  RESULT_OUTBOX_DIR = '/data/results'

[[mounts]]
  source = 'results'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 4000
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[services.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
